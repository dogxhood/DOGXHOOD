<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#0D0D0D"/>
  <!-- Outer neon ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#C8FF00" stroke-width="12"/>
  <!-- Hood shape (black hoodie body) -->
  <ellipse cx="256" cy="340" rx="140" ry="100" fill="#1a1a1a"/>
  <!-- Hood top arc -->
  <path d="M 140 280 Q 140 180 256 170 Q 372 180 372 280" fill="#111111" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Dog face circle -->
  <circle cx="256" cy="230" r="80" fill="#D4853A"/>
  <!-- Dog snout -->
  <ellipse cx="256" cy="255" rx="35" ry="28" fill="#E8A060"/>
  <!-- Nose -->
  <ellipse cx="256" cy="243" rx="14" ry="10" fill="#2a1a0a"/>
  <!-- Eyes -->
  <circle cx="228" cy="218" r="10" fill="#3a2200"/>
  <circle cx="284" cy="218" r="10" fill="#3a2200"/>
  <!-- Eye shine -->
  <circle cx="232" cy="214" r="3" fill="white"/>
  <circle cx="288" cy="214" r="3" fill="white"/>
  <!-- Hoodie neon green accent lines -->
  <path d="M 150 275 L 130 360" stroke="#00FF41" stroke-width="5" stroke-linecap="round"/>
  <path d="M 362 275 L 382 360" stroke="#00FF41" stroke-width="5" stroke-linecap="round"/>
  <!-- Hood outline neon -->
  <path d="M 156 278 Q 150 200 256 192 Q 362 200 356 278" fill="none" stroke="#00FF41" stroke-width="4" opacity="0.6"/>
  <!-- DXHOOD letters at bottom -->
  <text x="256" y="430" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="42" fill="#C8FF00" letter-spacing="2">$DXHOOD</text>
</svg>
